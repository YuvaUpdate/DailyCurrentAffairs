[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hello-world/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/home/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/*https*"
  to = "/"
  status = 301

[build.environment]
  NODE_VERSION = "18"
